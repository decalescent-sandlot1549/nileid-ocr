name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check src tests scripts demo
      - name: Check formatting
        run: ruff format --check src tests scripts demo

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only PyTorch: the default wheel pulls hundreds of megabytes of
      # CUDA libraries that CI has no use for.
      - name: Install PyTorch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install the package
        run: pip install -e ".[dev,api,demo]"

      # The model weights are release assets, not repository content, so
      # the model-dependent tests are skipped here. Everything else -- the
      # National ID logic, Arabic normalisation, preprocessing geometry,
      # the result schema, the API guards and the repository-hygiene
      # checks -- runs on every push.
      - name: Run tests
        run: pytest -v -m "not models"

      - name: Import smoke test
        shell: bash
        run: |
          python -c "import nileid; print('nileid', nileid.__version__)"
          python -c "from nileid import EgyptianIDReader, Settings; print('reader import ok')"
          python -c "from nileid.api.app import app; print('api import ok')"

      - name: CLI smoke test
        shell: bash
        run: |
          python -m nileid.cli --version
          python -m nileid.cli validate 29001010100017
          python -m nileid.cli check || true

      - name: Sample generator smoke test
        run: python scripts/make_sample_card.py --out /tmp/sample.png
        if: runner.os != 'Windows'

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
