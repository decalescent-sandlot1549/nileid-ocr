# Streamlit configuration for the NileID demo.

[browser]
# This project processes identity documents. Streamlit collects anonymous
# usage statistics by default; that is switched off here so the demo makes
# no outbound calls of its own.
gatherUsageStats = false

[server]
# Uploads are held in memory and discarded after the response. The cap is
# lower than Streamlit's 200 MB default because a card photograph is small
# and a large upload is far more likely to be a mistake than a card.
maxUploadSize = 10

[theme]
base = "light"
primaryColor = "#1a6fb5"
