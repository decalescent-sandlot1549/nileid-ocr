[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nileid"
version = "1.0.0"
description = "Computer-vision and Arabic OCR pipeline for structured information extraction from Egyptian National ID cards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Sayed" }]
keywords = [
    "ocr", "arabic-ocr", "computer-vision", "document-ai",
    "information-extraction", "id-card", "egypt", "yolo", "opencv",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Natural Language :: Arabic",
]

dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.1",
    "easyocr>=1.7",
    "rapidfuzz>=3.0",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4.2",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
demo = ["streamlit>=1.30"]
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # starlette.testclient needs an HTTP client; without it tests/test_api.py
    # cannot construct a TestClient and skips.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ahmedsayed1911/nileid-ocr"
Repository = "https://github.com/ahmedsayed1911/nileid-ocr"
Issues = "https://github.com/ahmedsayed1911/nileid-ocr/issues"

[project.scripts]
nileid = "nileid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nileid = ["py.typed"]

# ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "models: tests that require the YOLO weight files to be present",
    "ocr: tests that require an OCR engine and download language models",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI's Depends/File default-argument idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
